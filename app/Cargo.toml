# The portable "application" crate: everything in here must compile for ANY
# chip, so it may only depend on hardware-agnostic crates (embassy-*,
# embedded-hal traits, pure-logic libraries). If you find yourself wanting an
# `esp-*` or `stm32-*` dependency here, that code belongs in a board crate.
# See docs/decisions/0001-app-board-split.md for the reasoning.

[package]
name    = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
# Networking types (Stack, TCP, DNS). The chip-specific *driver* behind the
# stack lives in the board crate; this crate only sees the portable interface.
embassy-net  = { version = "0.9.1", default-features = false, features = ["proto-ipv4", "tcp", "dns", "medium-ethernet"] }
embassy-time = "0.5.0"
# The portability seam for hardware: traits like OutputPin that every HAL
# (esp-hal, embassy-stm32, rp-hal, ...) implements.
embedded-hal = "1.0"
reqwless     = { version = "0.14.0", default-features = false, features = ["log"] }
log          = "0.4"

# Dev-dependencies only apply when building THIS crate's tests/benches; they
# are invisible to downstream crates (boards consume `app` as a normal
# dependency), so nothing here can leak into firmware builds. Re-declaring
# embassy-time with an extra feature is the standard way to turn a feature on
# for tests only: cargo unifies it with the normal dependency above.
[dev-dependencies]
# `mock-driver` swaps in a fake, manually-advanced clock (MockDriver) so
# tests control time deterministically instead of sleeping for real.
embassy-time = { version = "0.5.0", features = ["mock-driver"] }
# On hardware these two are provided by the board crate (esp-hal implements
# critical sections; esp-rtos integrates the timer queue into its executor).
# A host test binary has neither, so the test build supplies std-friendly
# fallbacks: critical-section's std implementation, and a self-contained
# "generic" timer queue (capacity 8) that needs no executor.
critical-section         = { version = "1.2.0", features = ["std"] }
embassy-time-queue-utils = { version = "0.3.2", features = ["generic-queue-8"] }
