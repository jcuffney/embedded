# Two toolchain worlds, two jobs: the root workspace (crates/) builds on the
# host with stable Rust; each board crate is excluded from the workspace and
# cross-compiles with its own toolchain from its own directory. See
# docs/decisions/0004-ci-github-actions.md and 0002.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch/PR cancels the still-running CI for the old
# commit — no point finishing checks on code that's already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The capability crates (root workspace) compile for the host with plain
  # stable Rust, so they get the full treatment: formatting, lints-as-errors,
  # and unit tests. Runs from the repo root — `--workspace` covers every
  # member; boards are excluded and handled by their own jobs below.
  host:
    name: host workspace (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # llvm-tools ships the profiling runtime cargo-llvm-cov needs to
          # instrument the test binary for coverage.
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      # Prebuilt cargo-llvm-cov binary; much faster than `cargo install`.
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Runs the same suite as `cargo test`, instrumented for coverage, and
      # fails if line coverage drops below the floor. The number is measured,
      # rounded down — a ratchet against regression, not an aspiration. Raise
      # it in the same PR when coverage meaningfully improves. History: 75 at
      # introduction (ADR 0005), 85 after the HTTP trait seam (ADR 0006);
      # unchanged by the workspace split (ADR 0002, measured 88).
      - name: Test with coverage floor
        run: cargo llvm-cov --workspace --fail-under-lines 85

  # The board crate cross-compiles to xtensa-esp32-none-elf, which needs
  # Espressif's Rust fork (upstream rustc has no Xtensa backend). The produced
  # binary can't execute on the x86 runner, so this job checks that the code
  # lints and builds — no `cargo test`, and never `cargo run` (that would
  # invoke espflash).
  esp32:
    name: esp32 (xtensa, esp toolchain)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boards/esp32
    steps:
      - uses: actions/checkout@v4

      # ldproxy is only needed for ESP-IDF (std) projects; this is bare-metal.
      - uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32
          ldproxy: false

      # build-std recompiles core/alloc from source on a cold build, so the
      # cache saves several minutes per run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: boards/esp32

      # main.rs reads WIFI_SSID/WIFI_PASSWORD at compile time via env!();
      # dummy credentials satisfy the build and nothing is ever flashed here.
      - name: Provide dummy .env
        run: cp .env.example .env

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --release -- -D warnings

      - name: Build
        run: cargo build --release
